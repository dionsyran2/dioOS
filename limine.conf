timeout: 30

/dioOS (Normal Boot)
    resolution: 1920x1080x32
    protocol: limine
    module_path: boot():/initfs.tar
    module_string: initfs
    path: boot():/boot/kernel.elf

/dioOS (No SMP)
    resolution: 1920x1080x32
    protocol: limine
    module_path: boot():/initfs.tar
    module_string: initfs
    path: boot():/boot/kernel.elf
    cmdline: no-smp
